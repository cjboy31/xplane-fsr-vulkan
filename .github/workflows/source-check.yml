name: Public source check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_source.py
  windows-regressions:
    needs: source-policy
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned Windows compiler and verify its digest
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash.ToLowerInvariant() -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw 'Compiler archive digest mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
      - name: Check CPU, saved settings, session logs, update channels and UI
        run: ./Test-Regression.ps1 -Compiler "$env:RUNNER_TEMP/llvm-mingw-20261020-ucrt-x86_64/bin/clang++.exe"
