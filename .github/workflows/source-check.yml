name: Public source check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/audit_source.py
      - name: Portable frame-pacing policy tests
        run: g++ -std=c++17 -Wall -Wextra -Werror src/frame_pacing_tests.cpp -o frame-pacing-tests && ./frame-pacing-tests
      - name: Portable CPU scheduling plan tests
        run: g++ -std=c++17 -Wall -Wextra -Werror src/cpu_scheduling_tests.cpp -o cpu-scheduling-tests && ./cpu-scheduling-tests
      - name: Shared motion contract (pinned copy, conformance tests)
        run: |
          python tools/check_motion_contract.py
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -Isrc src/motion_contract_tests.cpp -o motion-contract-tests && ./motion-contract-tests
      - name: Motion-quality tool self-test (synthetic captures)
        run: python -I tools/test_motion_quality.py
      - name: Native-motion SSR interface classifier (original stand-in shaders)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq glslang-tools
          glslangValidator -V --target-env vulkan1.2 -S comp -DINPUT_ARRAY=0 src/native_motion_fixture.comp -o nmf0.spv
          glslangValidator -V --target-env vulkan1.2 -S comp -DINPUT_ARRAY=1 src/native_motion_fixture.comp -o nmf1.spv
          glslangValidator -V --target-env vulkan1.2 -S comp -DINPUT_MS=1 src/native_motion_fixture.comp -o nmfms.spv
          for v in "" "-DINPUT_ARRAY=1" "-DHISTORY_UPDATE=1" "-DINPUT_MS=1"; do glslangValidator -V --target-env vulkan1.2 -S comp $v src/native_motion.comp -o /dev/null; done
          glslangValidator -V --target-env vulkan1.2 -S comp src/temporal.comp -o /dev/null
          g++ -std=c++17 -Wall -Wextra -Werror src/native_motion/classify_tests.cpp src/native_motion/shader_classify.cpp -o classify-tests && ./classify-tests nmf0.spv nmf1.spv nmfms.spv
  windows-regressions:
    needs: source-policy
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned Windows compiler and verify its digest
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          Invoke-WebRequest 'https://github.com/mstorsjo/llvm-mingw/releases/download/20261020/llvm-mingw-20261020-ucrt-x86_64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive).Hash.ToLowerInvariant() -ne 'fd5462b7f5d93b2ff981fcd3f9c7e427e47f3203c64ea91c27bcc444eebd74cd') {
            throw 'Compiler archive digest mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
      - name: Check CPU, saved settings, session logs, update channels and UI
        run: ./Test-Regression.ps1 -Compiler "$env:RUNNER_TEMP/llvm-mingw-20261020-ucrt-x86_64/bin/clang++.exe"
  portable-file-worker:
    needs: source-policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check bounded file worker on Linux (no rendering claim)
        run: |
          g++ -std=c++17 -O2 -pthread src/background_files_tests.cpp -o /tmp/background-files-tests
          /tmp/background-files-tests
